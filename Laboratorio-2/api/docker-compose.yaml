version: '3'

services:
  api1:
    container_name: api1
    image: nmatsui/hello-world-api:0.1.1
    ports:
      - 3001:3000

  api2:
    container_name: api2
    image: nmatsui/hello-world-api:0.1.1
    ports:
      - 3000:3000

  api3:
  container_name: api3
  image: nmatsui/hello-world-api:0.1.1
  ports:
    - 3002:3000

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
